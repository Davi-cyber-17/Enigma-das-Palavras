<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050a1a">
<title>Enigma das Palavras</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="bg"><div class="gridfx"></div><i></i><i></i></div>
<div id="app">
  <header id="top">
    <div class="pill"><svg viewBox="0 0 24 24"><path d="M12 2 3 9l9 13 9-13z"/></svg><span id="gems">250</span></div>
    <div class="pill title">NÍVEL <span id="lvl">1</span></div>
    <div class="pill" title="Palavras bônus"><svg viewBox="0 0 24 24"><path d="m12 2 3 7 7 .6-5.3 4.8 1.6 7.1L12 17.8 5.7 21.5l1.6-7.1L2 9.600 9 9z"/></svg><span id="bonus">0</span></div>
  </header>
  <main id="board">
    <div id="gridWrap"><div id="grid"></div></div>
    <div id="msgbox"><div id="bubble"></div><div id="msg"></div></div>
  </main>
  <section id="stage">
    <div id="side">
      <button class="round" id="hintBtn" aria-label="Dica"><svg viewBox="0 0 24 24"><path d="M9 21h6M10 17h4M12 3a6 6 0 0 0-4 10.500c.7.700 1 1.500 1 2.500h6c0-1 .3-1.800 1-2.500A6 6 0 0 0 12 3z"/></svg><small>50</small></button>
      <button class="round" id="revBtn" aria-label="Revelar letra"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-5-5"/></svg><small>30</small></button>
    </div>
    <div id="wheel"><svg id="svg" viewBox="0 0 290 290"><polyline id="line" fill="none" stroke="#22d3ee" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/></svg><button id="shuf" aria-label="Embaralhar"><svg viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button></div>
  </section>
</div>
<div id="ov"><div><h2>NÍVEL COMPLETO</h2><p id="ovt"></p><button id="next">Próximo nível ▸</button></div></div>

<script src="script.js"></script>
</body>
</html>
